plugins {
    id 'java-library'
    id 'idea'
    id 'maven-publish'
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'com.google.protobuf' version '0.9.5'
    id 'com.gradleup.shadow' version '9.4.1'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

apply from: 'gradle/local-properties.gradle'
apply from: 'gradle/native.gradle'
apply from: 'gradle/schema.gradle'

version = mod_version
group = 'com.elfmcys.ysm'
base {
    archivesName = 'ysm'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

loom {
    mods {
        ysm {
            sourceSet sourceSets.main
        }
    }

    runs {
        configureEach {
            vmArgs "-XX:+IgnoreUnrecognizedVMOptions", "-XX:+AllowEnhancedClassRedefinition"
        }

        client {
            client()
            runDir project.file('run/client_a').absolutePath
        }

        client2 {
            client()
            runDir project.file('run/client_b').absolutePath
            programArgs "--username", "tartaric_acid"
        }

        server {
            server()
            runDir project.file('run/server').absolutePath
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

processResources {
    inputs.property "mod_version", project.version
    filteringCharset "UTF-8"

    from("LICENSE")
    from("NOTICE.md")

    filesMatching("fabric.mod.json") {
        expand "mod_version": project.version
    }
}

repositories {
    mavenCentral()
    maven {
        name = 'Sponge'
        url = 'https://repo.spongepowered.org/repository/maven-public/'
    }
}

def mavenCentralHosts = ['repo.maven.apache.org', 'repo1.maven.org']
repositories.withType(MavenArtifactRepository).configureEach { repo ->
    if (!mavenCentralHosts.contains(repo.url.host)) {
        repo.content {
            excludeGroup 'com.google.protobuf'
            excludeGroup 'us.hebi.quickbuf'
        }
    }
}

configurations {
    processorAsm {
        canBeConsumed = false
        canBeResolved = true
    }
    ysmImplementation
    implementation.extendsFrom ysmImplementation
}

def relocateProcessorAsmTask = tasks.register(
        'relocateProcessorAsm',
        com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar) {
    group = 'build setup'
    description = 'Relocates the ASM implementation embedded for the annotation processor.'
    configurations = [project.configurations.processorAsm]
    archiveFileName = 'ysm-processor-asm.jar'
    destinationDirectory = layout.buildDirectory.dir('processor-libs')
    relocate 'org.objectweb.asm', 'com.elfmcys.ysm.api.internal.processor.asm'
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    processorAsm 'org.ow2.asm:asm:9.7.1'
    processorAsm 'org.ow2.asm:asm-tree:9.7.1'

    compileOnly files(relocateProcessorAsmTask.flatMap { it.archiveFile })

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    // Fabric Loader 内置 MixinExtras，无需打包
    compileOnly 'io.github.llamalad7:mixinextras-common:0.3.6'
    annotationProcessor 'io.github.llamalad7:mixinextras-common:0.3.6'

    compileOnly 'org.jetbrains:annotations:26.0.1'

    ysmImplementation 'us.hebi.quickbuf:quickbuf-runtime:1.4'
    implementation 'org.yaml:snakeyaml:2.2'

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

jar {
    manifest.attributes([
            "Implementation-Title"  : project.name,
            "Implementation-Version": "${version}",
            "MixinConfigs"          : "ysm.mixins.json"
    ])
    archiveClassifier = "raw"
}

tasks.named('shadowJar') {
    dependsOn relocateProcessorAsmTask
    from(relocateProcessorAsmTask.flatMap { it.archiveFile }.map { archive ->
        project.zipTree(archive.asFile)
    })
    configurations = [project.configurations.ysmImplementation]
    archiveClassifier = ''
    exclude '**/*.proto'
    relocate 'us.hebi.quickbuf', 'com.elfmcys.quickbuf'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += [
            '-Xlint:-removal'
    ]
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
